<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encontra Tudo</title>

<style>
  /* ======================================================
     TOKENS — paleta, tipografia e espaçamentos do projeto
     ====================================================== */
  :root{
    --bg:            #07090d;
    --bg-elev:       #0f131a;
    --card:          #12161f;
    --card-border:   #1f2530;
    --card-border-hover: #2c3444;

    --text:          #e7ebf2;
    --text-muted:    #8993a4;
    --text-dim:      #5c6577;

    --blue:          #4d8bff;
    --red:           #ff5c5c;
    --green:         #35d68c;

    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;

    --font-ui:   'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'Consolas', 'SFMono-Regular', 'Roboto Mono', monospace;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(77,139,255,0.08), transparent 40%),
      radial-gradient(circle at 100% 20%, rgba(53,214,140,0.06), transparent 35%),
      linear-gradient(var(--bg), var(--bg));
    min-height:100vh;
  }

  /* ======================================================
     CABEÇALHO
     ====================================================== */
  header{
    background:var(--bg-elev);
    border-bottom:1px solid var(--card-border);
    padding:22px clamp(16px, 4vw, 48px);
    display:flex;
    align-items:center;
    gap:14px;
    position:sticky;
    top:0;
    z-index:20;
  }

  .logo-mark{
    width:40px; height:40px;
    flex:none;
    border-radius:12px;
    background:linear-gradient(135deg, var(--blue), var(--green));
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06) inset, 0 6px 18px rgba(77,139,255,0.25);
  }
  .logo-mark svg{ width:22px; height:22px; }

  header h1{ font-size:1.35rem; font-weight:700; margin:0; }
  header p.tagline{ margin:2px 0 0; font-size:0.82rem; color:var(--text-muted); }

  main{
    max-width:1080px;
    margin:0 auto;
    padding:28px clamp(16px, 4vw, 48px) 80px;
  }

  /* ======================================================
     FORMULÁRIO PARA ADICIONAR MATERIAL
     ====================================================== */
  .add-panel{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius-lg);
    padding:20px 22px;
    margin-bottom:22px;
  }
  .add-panel h2{
    margin:0 0 14px;
    font-size:0.95rem;
    font-weight:600;
    color:var(--text-muted);
  }
  .add-form{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .add-form-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  #materialInput, #categorySelect{
    padding:12px 14px;
    border-radius:var(--radius-md);
    border:1px solid var(--card-border);
    background:var(--bg-elev);
    color:var(--text);
    font-size:0.95rem;
    outline:none;
    transition:border-color 0.2s, box-shadow 0.2s;
  }
  #materialInput{ flex:2; min-width:180px; }
  #categorySelect{ flex:1; min-width:140px; }
  #materialInput:focus, #categorySelect:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(77,139,255,0.18);
  }
  #materialInput::placeholder{ color:var(--text-dim); }

  .btn-add{
    padding:12px 20px;
    border-radius:var(--radius-md);
    border:1px solid var(--blue);
    background:rgba(77,139,255,0.14);
    color:#bdd4ff;
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
    transition:background 0.2s, transform 0.12s;
    flex:none;
  }
  .btn-add:hover{ background:rgba(77,139,255,0.24); }
  .btn-add:active{ transform:scale(0.97); }

  /* ======================================================
     PAINEL DE PROGRESSO
     ====================================================== */
  .progress-panel{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius-lg);
    padding:20px 22px;
    margin-bottom:22px;
  }
  .progress-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
  }
  .progress-count{ font-family:var(--font-mono); font-size:1rem; }
  .progress-count strong{ color:var(--green); font-weight:700; }
  .progress-percent{ font-family:var(--font-mono); font-size:0.95rem; color:var(--text-muted); }

  .progress-track{
    width:100%; height:10px;
    border-radius:999px;
    background:#1a2029;
    overflow:hidden;
    border:1px solid var(--card-border);
  }
  .progress-fill{
    height:100%; width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--blue), var(--green));
    transition:width 0.35s ease;
  }

  /* ======================================================
     CONTROLES — busca, categorias, ações
     ====================================================== */
  .controls{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:20px;
  }
  .search-wrap{ position:relative; }
  .search-wrap svg{
    position:absolute; left:14px; top:50%;
    transform:translateY(-50%);
    width:18px; height:18px;
    color:var(--text-dim);
    pointer-events:none;
  }
  #searchInput{
    width:100%;
    padding:13px 14px 13px 42px;
    border-radius:var(--radius-md);
    border:1px solid var(--card-border);
    background:var(--card);
    color:var(--text);
    font-size:0.95rem;
    outline:none;
    transition:border-color 0.2s, box-shadow 0.2s;
  }
  #searchInput::placeholder{ color:var(--text-dim); }
  #searchInput:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(77,139,255,0.18);
  }

  .category-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--card-border);
    background:var(--bg-elev);
    color:var(--text-muted);
    font-size:0.82rem;
    cursor:pointer;
    transition:border-color 0.2s, color 0.2s, background 0.2s;
    user-select:none;
  }
  .chip:hover{ color:var(--text); border-color:var(--card-border-hover); }
  .chip.active{
    background:rgba(77,139,255,0.12);
    border-color:var(--blue);
    color:#bdd4ff;
  }

  .action-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .btn{
    padding:10px 16px;
    border-radius:var(--radius-sm);
    border:1px solid var(--card-border);
    background:var(--bg-elev);
    color:var(--text);
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:transform 0.12s ease, border-color 0.2s, background 0.2s;
  }
  .btn:hover{ border-color:var(--card-border-hover); }
  .btn:active{ transform:scale(0.97); }
  .btn-mark{ color:#a8f0cf; }
  .btn-mark:hover{ border-color:var(--green); background:rgba(53,214,140,0.08); }
  .btn-unmark{ color:#ffd4a8; }
  .btn-unmark:hover{ border-color:#ffb84d; background:rgba(255,184,77,0.08); }
  .btn-reset{ color:#ffb0b0; }
  .btn-reset:hover{ border-color:var(--red); background:rgba(255,92,92,0.08); }

  /* ======================================================
     GRID DE MATERIAIS
     ====================================================== */
  .material-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:14px;
  }

  .material-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius-lg);
    padding:18px;
    transition:border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .material-card:hover{ border-color:var(--card-border-hover); transform:translateY(-2px); }
  .material-card.found{
    border-color:var(--green);
    background:linear-gradient(160deg, rgba(53,214,140,0.10), var(--card) 60%);
  }

  .material-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }

  .material-info{ cursor:pointer; flex:1; min-width:0; }
  .material-name{
    font-size:1.02rem;
    font-weight:600;
    margin:0 0 4px;
    word-break:break-word;
  }
  .material-category{
    font-size:0.72rem;
    color:var(--text-muted);
    font-family:var(--font-mono);
    text-transform:lowercase;
  }

  .card-buttons{ display:flex; gap:8px; flex:none; }

  /* checkmark redondo */
  .check-btn{
    width:28px; height:28px;
    border-radius:50%;
    border:2px solid var(--card-border-hover);
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex:none;
    transition:all 0.2s ease;
    color:transparent;
  }
  .check-btn svg{
    width:15px; height:15px;
    stroke:currentColor;
    stroke-width:3;
    fill:none;
    transform:scale(0.6);
    transition:transform 0.2s ease;
  }
  .material-card.found .check-btn{
    background:var(--green);
    border-color:var(--green);
    color:#04140d;
  }
  .material-card.found .check-btn svg{ transform:scale(1); }

  /* botão de remover material */
  .remove-btn{
    width:28px; height:28px;
    border-radius:50%;
    border:2px solid var(--card-border-hover);
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex:none;
    color:var(--text-dim);
    transition:all 0.2s ease;
  }
  .remove-btn:hover{ border-color:var(--red); color:var(--red); }
  .remove-btn svg{ width:13px; height:13px; stroke:currentColor; stroke-width:2.4; fill:none; }

  .material-status{ font-size:0.78rem; color:var(--text-dim); }
  .material-card.found .material-status{ color:var(--green); font-weight:600; }

  /* estado vazio */
  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--text-dim);
    font-size:0.92rem;
    border:1px dashed var(--card-border);
    border-radius:var(--radius-lg);
  }

  /* ======================================================
     RESPONSIVO
     ====================================================== */
  @media (min-width:640px){
    .controls{ flex-direction:row; align-items:center; }
    .search-wrap{ flex:1; min-width:220px; }
    .category-row{ flex:none; }
  }

  @media (max-width:420px){
    .material-grid{ grid-template-columns:1fr 1fr; }
    .material-card{ padding:14px; }
  }

  button:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="logo-mark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 13l4 4L19 7" stroke="#04140d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div>
    <h1>Encontra Tudo</h1>
    <p class="tagline">Digite os materiais que você precisa e marque conforme for encontrando</p>
  </div>
</header>

<main>

  <!-- ===================== ADICIONAR MATERIAL ===================== -->
  <section class="add-panel">
    <h2>Adicionar material</h2>
    <form class="add-form" id="addForm">
      <div class="add-form-row">
        <input type="text" id="materialInput" placeholder="Ex: Madeira, Diamante, Parafuso..." autocomplete="off">
        <select id="categorySelect">
          <option value="Minérios">Minérios</option>
          <option value="Construção">Construção</option>
          <option value="Naturais">Naturais</option>
          <option value="Raros">Raros</option>
          <option value="Outros">Outros</option>
        </select>
        <button type="submit" class="btn-add">+ Adicionar</button>
      </div>
    </form>
  </section>

  <!-- ===================== PAINEL DE PROGRESSO ===================== -->
  <section class="progress-panel">
    <div class="progress-top">
      <span class="progress-count" id="counterText">0 de 0 materiais encontrados</span>
      <span class="progress-percent" id="percentText">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </section>

  <!-- ===================== CONTROLES ===================== -->
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Pesquisar na sua lista..." autocomplete="off">
    </div>
    <div class="category-row" id="categoryRow"></div>
  </div>

  <div class="action-row">
    <button class="btn btn-mark" id="btnMarkAll">Marcar todos</button>
    <button class="btn btn-unmark" id="btnUnmarkAll">Desmarcar todos</button>
    <button class="btn btn-reset" id="btnReset">Resetar lista</button>
  </div>

  <!-- ===================== GRADE DE MATERIAIS ===================== -->
  <div class="material-grid" id="materialGrid"></div>

</main>

<script>
/* ============================================================
   ESTADO
   Cada material do usuário é um objeto:
   { id, nome, categoria, encontrado }
   Tudo é criado pelo próprio usuário através do formulário.
   ============================================================ */
const STORAGE_KEY = 'encontraTudo_lista';
const CATEGORIAS = ['Todos', 'Minérios', 'Construção', 'Naturais', 'Raros', 'Outros'];

let materiais = carregarEstado();   // array de materiais do usuário
let categoriaAtiva = 'Todos';
let termoBusca = '';

/* ============================================================
   PERSISTÊNCIA (localStorage)
   ============================================================ */
function carregarEstado(){
  try{
    const salvo = localStorage.getItem(STORAGE_KEY);
    return salvo ? JSON.parse(salvo) : [];
  }catch(e){
    console.warn('Não foi possível ler o localStorage:', e);
    return [];
  }
}

function salvarEstado(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(materiais));
  }catch(e){
    console.warn('Não foi possível salvar no localStorage:', e);
  }
}

function gerarId(){
  return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
}

/* ============================================================
   CATEGORIAS (chips de filtro)
   ============================================================ */
const categoryRow = document.getElementById('categoryRow');

function renderCategorias(){
  categoryRow.innerHTML = '';
  CATEGORIAS.forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (cat === categoriaAtiva ? ' active' : '');
    chip.type = 'button';
    chip.textContent = cat;
    chip.addEventListener('click', () => {
      categoriaAtiva = cat;
      renderCategorias();
      renderMateriais();
    });
    categoryRow.appendChild(chip);
  });
}

/* ============================================================
   ADICIONAR MATERIAL — via formulário
   ============================================================ */
const addForm = document.getElementById('addForm');
const materialInput = document.getElementById('materialInput');
const categorySelect = document.getElementById('categorySelect');

addForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const nome = materialInput.value.trim();
  if(!nome) return;

  materiais.push({
    id: gerarId(),
    nome: nome,
    categoria: categorySelect.value,
    encontrado: false
  });

  salvarEstado();
  materialInput.value = '';
  materialInput.focus();
  renderMateriais();
});

/* ============================================================
   RENDERIZAÇÃO — grade de materiais
   ============================================================ */
const materialGrid = document.getElementById('materialGrid');

function renderMateriais(){
  materialGrid.innerHTML = '';

  const busca = termoBusca.trim().toLowerCase();

  const filtrados = materiais.filter(m => {
    const passaCategoria = categoriaAtiva === 'Todos' || m.categoria === categoriaAtiva;
    const passaBusca = m.nome.toLowerCase().includes(busca);
    return passaCategoria && passaBusca;
  });

  if(materiais.length === 0){
    const vazio = document.createElement('div');
    vazio.className = 'empty-state';
    vazio.textContent = 'Sua lista está vazia. Adicione um material acima para começar.';
    materialGrid.appendChild(vazio);
    atualizarProgresso();
    return;
  }

  if(filtrados.length === 0){
    const vazio = document.createElement('div');
    vazio.className = 'empty-state';
    vazio.textContent = 'Nenhum material da sua lista corresponde a essa pesquisa/filtro.';
    materialGrid.appendChild(vazio);
    atualizarProgresso();
    return;
  }

  filtrados.forEach(m => {
    const card = document.createElement('div');
    card.className = 'material-card' + (m.encontrado ? ' found' : '');

    card.innerHTML = `
      <div class="material-top">
        <div class="material-info">
          <p class="material-name"></p>
          <span class="material-category"></span>
        </div>
        <div class="card-buttons">
          <button class="check-btn" type="button" aria-label="Marcar como encontrado">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
          </button>
          <button class="remove-btn" type="button" aria-label="Remover material">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <span class="material-status">${m.encontrado ? 'Encontrado' : 'Ainda não encontrado'}</span>
    `;

    // nome e categoria são inseridos via textContent (evita problemas com o que o usuário digitou)
    card.querySelector('.material-name').textContent = m.nome;
    card.querySelector('.material-category').textContent = m.categoria;

    // clicar no nome/área de informação alterna o estado de encontrado
    card.querySelector('.material-info').addEventListener('click', () => alternarEncontrado(m.id));
    card.querySelector('.check-btn').addEventListener('click', () => alternarEncontrado(m.id));

    // remover material da lista
    card.querySelector('.remove-btn').addEventListener('click', () => removerMaterial(m.id));

    materialGrid.appendChild(card);
  });

  atualizarProgresso();
}

/* ============================================================
   AÇÕES
   ============================================================ */
function alternarEncontrado(id){
  const material = materiais.find(m => m.id === id);
  if(!material) return;
  material.encontrado = !material.encontrado;
  salvarEstado();
  renderMateriais();
}

function removerMaterial(id){
  materiais = materiais.filter(m => m.id !== id);
  salvarEstado();
  renderMateriais();
}

document.getElementById('btnMarkAll').addEventListener('click', () => {
  materiais.forEach(m => m.encontrado = true);
  salvarEstado();
  renderMateriais();
});

document.getElementById('btnUnmarkAll').addEventListener('click', () => {
  materiais.forEach(m => m.encontrado = false);
  salvarEstado();
  renderMateriais();
});

document.getElementById('btnReset').addEventListener('click', () => {
  if(materiais.length > 0 && !confirm('Isso vai apagar toda a sua lista de materiais. Continuar?')) return;
  materiais = [];
  categoriaAtiva = 'Todos';
  termoBusca = '';
  document.getElementById('searchInput').value = '';
  salvarEstado();
  renderCategorias();
  renderMateriais();
});

/* ============================================================
   BUSCA EM TEMPO REAL
   ============================================================ */
document.getElementById('searchInput').addEventListener('input', (e) => {
  termoBusca = e.target.value;
  renderMateriais();
});

/* ============================================================
   CONTADOR + BARRA DE PROGRESSO
   ============================================================ */
function atualizarProgresso(){
  const total = materiais.length;
  const total_encontrados = materiais.filter(m => m.encontrado).length;
  const percentual = total === 0 ? 0 : Math.round((total_encontrados / total) * 100);

  document.getElementById('counterText').innerHTML =
    `<strong>${total_encontrados}</strong> de ${total} materiais encontrados`;
  document.getElementById('percentText').textContent = `${percentual}%`;
  document.getElementById('progressFill').style.width = `${percentual}%`;
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
renderCategorias();
renderMateriais();
</script>

</body>
</html>
